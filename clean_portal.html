<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pratap Vidhya Mandir - CMS</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            mint: {
              DEFAULT: '#98FB98',
              dark: '#7be17b'
            }
          }
        }
      }
    }
  </script>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --mint-green: #98FB98;
      --mint-dark: #7be17b;
      --background: #f4fdf4;
    }
    body {
      background-color: var(--background);
      color: #333333;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    .animate-fade-in-scale {
      animation: fadeInScale 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    @keyframes fadeInScale {
      0% { opacity: 0; transform: scale(0.95); }
      100% { opacity: 1; transform: scale(1); }
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 8px 32px rgba(152, 251, 152, 0.15);
    }
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .skeleton-shimmer {
      background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: shimmer 2s infinite linear;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f1f1;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #98FB98;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const Skeleton = ({ type, count = 1 }) => {
      const items = Array.from({ length: count });
      if (type === 'stat') return (
        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
          {items.map((_, i) => (
            <div key={i} className="bg-white p-8 rounded-[40px] shadow-sm border border-gray-100">
               <div className="w-12 h-12 skeleton-shimmer rounded-2xl mb-4"></div>
               <div className="h-3 skeleton-shimmer rounded-full w-1/2 mb-3"></div>
               <div className="h-8 skeleton-shimmer rounded-2xl w-1/3"></div>
            </div>
          ))}
        </div>
      );
      return <div className="h-20 skeleton-shimmer rounded-[30px] w-full mb-4"></div>;
    };

    const SplashScreen = ({ onComplete }) => {
      useEffect(() => {
        const timer = setTimeout(() => onComplete(), 2500);
        return () => clearTimeout(timer);
      }, []);
      return (
        <div className="fixed inset-0 min-h-screen bg-white flex flex-col items-center justify-center z-50">
          <div className="animate-fade-in-scale flex flex-col items-center gap-4 text-center">
            <div className="bg-black p-4 rounded-full border-4 border-[#bf953f] shadow-2xl mb-4">
                <img src="https://pratapvidyamandirchopda.org/newlogo.jpg" alt="Logo" className="w-40 h-40 object-contain" style={{ mixBlendMode: 'screen' }} />
            </div>
            <h1 className="text-4xl font-extrabold text-gray-800 tracking-wider">Pratap Vidhya Mandir</h1>
            <p className="text-[#bf953f] font-bold uppercase tracking-[0.3em] text-sm italic">100 Years of Excellence</p>
          </div>
        </div>
      );
    };

    const Login = ({ onLoginSuccess }) => {
      const [id, setId] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [lang, setLang] = useState('en');

      const translations = {
        en: { title: 'Portal Registry', id: 'Official ID', pass: 'Password', btn: 'Secure Login →', error: 'Invalid Credentials.' },
        mr: { title: 'पोर्टल नोंदणी', id: 'अधिकृत आयडी', pass: 'पासवर्ड', btn: 'सुरक्षित लॉगिन →', error: 'चुकीची माहिती.' },
        hi: { title: 'पोर्टल पंजीकरण', id: 'आधिकारिक आईडी', pass: 'पासवर्ड', btn: 'सुरक्षित लॉगिन →', error: 'अमान्य क्रेडेंशियल.' }
      };

      const t = translations[lang];

      const handleLogin = (e) => {
        e.preventDefault();
        try {
          const allUsers = JSON.parse(localStorage.getItem('pvm_users') || '[]');
          
          // Debugging log so you can inspect in console if needed:
          console.log("Attempting Login with ID:", id, "Pass:", password);
          
          const foundUser = allUsers.find(u => 
            u && u.id && 
            String(u.id).trim().toUpperCase() === String(id).trim().toUpperCase() && 
            String(u.password) === String(password)
          );

          if (foundUser) {
            if (foundUser.blocked) {
              setError('ACCESS DENIED: Account Blocked.');
              return;
            }
            onLoginSuccess(foundUser);
          } else {
            setError(t.error);
          }
        } catch (err) {
          console.error("Login Error:", err);
          setError("System Error: Please clear browser cache.");
        }
      };

      return (
        <div className="min-h-screen flex flex-col justify-center py-12 sm:px-6 lg:px-8 relative overflow-hidden bg-[#0a0a0a]">
          <div className="absolute inset-0 z-0">
             <img src="https://upload.wikimedia.org/wikipedia/commons/9/9a/Pratap_Vidya_Mandir_Chopda_%28Photograph_by_Swapnil_Potdar%29.jpg" className="w-full h-full object-cover opacity-60 blur-sm scale-110" alt="Campus" />
             <div className="absolute inset-0 bg-gradient-to-tr from-black/80 via-transparent to-black/40"></div>
          </div>

          <div className="absolute top-8 right-8 z-20 flex gap-2">
             {['en', 'mr', 'hi'].map(l => (
               <button key={l} onClick={()=>setLang(l)} className={`px-4 py-2 rounded-xl font-black text-[10px] uppercase tracking-widest transition-all ${lang === l ? 'bg-mint text-gray-900 shadow-xl scale-110' : 'bg-white/10 text-white hover:bg-white/20'}`}>
                 {l === 'en' ? 'English' : (l === 'mr' ? 'मराठी' : 'हिंदी')}
               </button>
             ))}
          </div>

          <div className="sm:mx-auto sm:w-full sm:max-w-md z-10 animate-fade-in-scale">
             <div className="bg-white/90 backdrop-blur-xl px-10 py-12 rounded-[50px] shadow-[0_32px_64px_-12px_rgba(0,0,0,0.5)] border-t-8 border-mint relative overflow-hidden">
                <div className="absolute -top-24 -right-24 w-48 h-48 bg-mint/20 rounded-full blur-3xl"></div>
                <div className="absolute -bottom-24 -left-24 w-48 h-48 bg-mint/10 rounded-full blur-3xl"></div>
                
                <div className="flex justify-center mb-8 relative">
                    <div className="bg-black p-4 rounded-3xl shadow-2xl border-2 border-[#bf953f]">
                      <img src="https://pratapvidyamandirchopda.org/newlogo.jpg" className="w-20 h-20 object-contain" alt="Logo" style={{ mixBlendMode: 'screen' }} />
                    </div>
                </div>
                
                <h2 className="text-center text-3xl font-black text-gray-900 tracking-tighter uppercase italic mb-2">{t.title}</h2>
                <div className="w-16 h-1.5 bg-mint mx-auto mb-10 rounded-full"></div>

                <form className="space-y-6" onSubmit={handleLogin}>
                   <div className="space-y-2">
                      <label className="text-[10px] font-black text-gray-400 uppercase tracking-widest pl-2">{t.id}</label>
                      <input type="text" placeholder="e.g. STU01" className="w-full p-5 bg-gray-50 border-2 border-transparent focus:border-mint focus:bg-white rounded-[25px] font-bold transition-all outline-none" value={id} onChange={e=>setId(e.target.value)} required />
                   </div>
                   <div className="space-y-2">
                      <label className="text-[10px] font-black text-gray-400 uppercase tracking-widest pl-2">{t.pass}</label>
                      <input type="password" placeholder="••••••••" className="w-full p-5 bg-gray-50 border-2 border-transparent focus:border-mint focus:bg-white rounded-[25px] font-bold transition-all outline-none" value={password} onChange={e=>setPassword(e.target.value)} required />
                   </div>
                   {error && (
                     <div className="bg-red-50 text-red-500 p-4 rounded-2xl text-[10px] font-black text-center uppercase tracking-widest border border-red-100 animate-shake">
                        ⚠️ {error}
                     </div>
                   )}
                   <button type="submit" className="w-full bg-gray-900 text-white py-6 rounded-[30px] font-black tracking-[0.2em] uppercase hover:bg-black hover:scale-[1.02] active:scale-95 transition-all shadow-2xl shadow-mint/20">
                      {t.btn}
                   </button>
                </form>
                
                <p className="mt-8 text-center text-[8px] font-black text-gray-400 uppercase tracking-[0.3em] opacity-50">Pratap Vidhya Mandir • Centenary Digital Infrastructure</p>
             </div>
          </div>
        </div>
      );
    };

    const ProfileModal = ({ isOpen, onClose, data }) => {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm animate-fade-in">
          <div className="bg-white rounded-[40px] w-full max-w-sm overflow-hidden shadow-2xl animate-fade-in-scale">
            <div className="h-24 bg-mint"></div>
            <div className="px-8 pb-10 text-center -mt-12">
              <img src={data.image} className="w-32 h-32 rounded-[30px] mx-auto border-8 border-white shadow-xl bg-white" alt="User" />
              <h3 className="mt-4 text-2xl font-black text-gray-900">{data.name}</h3>
              <p className="text-mint-dark font-black uppercase text-[10px] tracking-[0.3em]">{data.role}</p>
              <div className="mt-8 space-y-4 text-left border-t pt-8">
                <div className="flex justify-between font-bold text-sm"><span className="text-gray-400 uppercase tracking-widest text-[10px]">Portal ID</span><span className="text-gray-900">{data.id}</span></div>
                <div className="flex justify-between font-bold text-sm"><span className="text-gray-400 uppercase tracking-widest text-[10px]">Standard</span><span className="text-gray-900">{data.class}</span></div>
              </div>
              <button onClick={onClose} className="mt-10 w-full bg-gray-900 text-white py-4 rounded-3xl font-black uppercase tracking-widest hover:bg-black transition-all">Close Info</button>
            </div>
          </div>
        </div>
      );
    };

    const CircleChart = ({ label, percentage }) => (
      <div className="p-6 bg-white rounded-3xl border border-gray-100 flex flex-col items-center hover:shadow-lg transition-all">
        <div className="relative w-24 h-24 mb-3">
          <svg className="w-full h-full rotate-[-90deg]" viewBox="0 0 36 36">
            <circle cx="18" cy="18" r="16" fill="none" stroke="#f3f4f6" strokeWidth="4" />
            <circle cx="18" cy="18" r="16" fill="none" stroke="#98FB98" strokeWidth="4" strokeDasharray={`${percentage}, 100`} strokeLinecap="round" />
          </svg>
          <div className="absolute inset-0 flex items-center justify-center font-black text-gray-800 text-lg">{percentage}%</div>
        </div>
        <span className="text-xs font-black text-gray-400 uppercase tracking-widest">{label}</span>
      </div>
    );

    const TeacherDashboard = ({ onLogout, user, onAddStudent }) => {
      const [view, setView] = useState('overview');
      const [submitted, setSubmitted] = useState(false);

      const navItems = [
        { key: 'overview',    icon: '🏠', label: 'Daily Schedule' },
        { key: 'attendance',  icon: '📅', label: 'Take Attendance' },
        { key: 'register',    icon: '👤', label: 'Register Student' },
        { key: 'upload',      icon: '📂', label: 'Upload Docs' },
        { key: 'schedule',    icon: '📆', label: 'My Schedule' },
        { key: 'profile',     icon: '🧑‍🏫', label: 'About Me' },
      ];

      const handleRegister = (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        onAddStudent({
          id: fd.get('studentId').toUpperCase(),
          password: fd.get('password'),
          name: fd.get('name'),
          role: 'student',
          class: fd.get('standard') + 'th Standard - Div ' + fd.get('div'),
          image: `https://api.dicebear.com/7.x/avataaars/svg?seed=${fd.get('name')}`,
          parentPhone: fd.get('parentPhone'),
        });
        alert('✅ Student Registered Successfully!');
        e.target.reset();
        setView('overview');
      };

      const schedule = [
        { time: '7:00 AM', subject: 'Marathi', room: 'G-12' },
        { time: '8:00 AM', subject: 'Hindi', room: 'G-12' },
        { time: '9:00 AM', subject: 'English', room: 'G-12' },
        { time: '10:00 AM', subject: 'Maths', room: 'G-12' },
        { time: '11:00 AM', subject: 'Science', room: 'Lab-2' },
        { time: '12:00 PM', subject: 'Social Science', room: 'G-12' },
      ];

      return (
        <div className="min-h-screen bg-gray-50 flex flex-col">
          <header className="bg-white border-b-4 border-gray-900 p-4">
            <div className="max-w-7xl mx-auto flex justify-between items-center">
              <div className="flex items-center gap-4">
                <img src="https://pratapvidyamandirchopda.org/newlogo.jpg" className="w-12 h-12 bg-black p-1 rounded-xl" alt="Logo" style={{ mixBlendMode: 'multiply' }} />
                <div>
                  <h1 className="font-black text-xl tracking-tight italic">Faculty Portal</h1>
                  <p className="text-[10px] font-black text-[#bf953f] uppercase tracking-widest">Pratap Vidhya Mandir</p>
                </div>
              </div>
              <div className="flex items-center gap-4">
                <span className="text-[10px] font-black text-gray-500 uppercase">{user.name}</span>
                <button onClick={onLogout} className="text-red-500 font-black text-xs uppercase tracking-widest border-2 border-red-400 px-3 py-1 rounded-xl hover:bg-red-500 hover:text-white transition-all">Exit</button>
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 py-8 w-full flex-1">
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">

              {/* LEFT SIDEBAR */}
              <div className="lg:col-span-3 space-y-3">
                {navItems.map(n => (
                  <div key={n.key} onClick={() => setView(n.key)}
                    className={`p-4 rounded-2xl cursor-pointer transition-all border-b-4 flex items-center gap-3 ${view === n.key ? 'bg-gray-900 text-white border-gray-700 shadow-xl' : 'bg-white text-gray-500 border-gray-100 hover:bg-gray-50'}`}>
                    <span className="text-2xl">{n.icon}</span>
                    <span className="font-black text-[11px] uppercase tracking-wider">{n.label}</span>
                  </div>
                ))}
              </div>

              {/* RIGHT CONTENT */}
              <div className="lg:col-span-9 space-y-6">

                {/* OVERVIEW - Daily Schedule */}
                {view === 'overview' && (
                  <div className="space-y-6 animate-fade-in-scale">
                    <div className="bg-gray-900 p-10 rounded-[40px] text-white shadow-2xl">
                      <h2 className="text-4xl font-black italic tracking-tighter mb-2">Good Morning, {user.name.split(' ')[0]}! 👋</h2>
                      <p className="text-gray-400 font-bold">Today's teaching overview for your class</p>
                      <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mt-8">
                        <div className="bg-white/10 p-4 rounded-2xl"><p className="text-[10px] text-[#98FB98] uppercase font-black">Lectures Today</p><p className="text-3xl font-black">6</p></div>
                        <div className="bg-white/10 p-4 rounded-2xl"><p className="text-[10px] text-[#98FB98] uppercase font-black">Total Students</p><p className="text-3xl font-black">60</p></div>
                        <div className="bg-white/10 p-4 rounded-2xl"><p className="text-[10px] text-[#98FB98] uppercase font-black">Room</p><p className="text-3xl font-black">G-12</p></div>
                        <div className="bg-white/10 p-4 rounded-2xl"><p className="text-[10px] text-[#98FB98] uppercase font-black">Academic Year</p><p className="text-3xl font-black">26-27</p></div>
                      </div>
                    </div>
                    <div className="bg-white p-6 rounded-[30px] shadow border border-gray-100">
                      <h3 className="font-black text-gray-900 uppercase tracking-widest text-sm border-l-4 border-[#98FB98] pl-3 mb-6">📆 Today's Teaching Schedule</h3>
                      <div className="divide-y divide-gray-50">
                        {schedule.map((s, i) => (
                          <div key={i} className="py-4 flex justify-between items-center hover:bg-gray-50 px-3 rounded-xl transition-all">
                            <div className="flex items-center gap-4">
                              <span className="w-8 h-8 bg-[#98FB98]/30 text-[#5acb5a] rounded-full flex items-center justify-center font-black text-sm">{i+1}</span>
                              <span className="font-black text-gray-800">{s.subject}</span>
                            </div>
                            <div className="flex gap-3">
                              <span className="text-xs bg-gray-100 px-3 py-1 rounded-xl font-bold text-gray-500">Room {s.room}</span>
                              <span className="text-xs bg-[#98FB98]/20 text-[#5acb5a] px-3 py-1 rounded-xl font-black">{s.time}</span>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                )}

                {/* ATTENDANCE */}
                {view === 'attendance' && (
                  <div className="animate-fade-in-scale bg-white p-8 rounded-[30px] shadow border border-gray-100">
                    <div className="flex justify-between items-center mb-8 pb-4 border-b">
                      <div>
                        <h3 className="text-xl font-black text-gray-900 italic">📅 Live Attendance — Class G-12</h3>
                        <p className="text-xs text-gray-400 mt-1 font-bold uppercase">Click A 🚨 to auto-send WhatsApp alert to parent</p>
                      </div>
                      <div className="flex gap-3">
                        <button onClick={() => { if(confirm('Submit attendance & send all alerts?')) { setSubmitted(true); alert('✅ Attendance submitted! WhatsApp alerts sent to absent parents.'); }}}
                          className="bg-gray-900 text-white px-5 py-3 rounded-xl text-xs font-black uppercase tracking-widest shadow-lg hover:bg-black transition-all">
                          Submit ✅
                        </button>
                        <button onClick={() => { if(confirm('Release Results to all parents via WhatsApp?')) { alert('📢 Broadcasting result links to all registered WhatsApp numbers...'); }}}
                          className="bg-[#98FB98] text-gray-900 px-5 py-3 rounded-xl text-xs font-black uppercase tracking-widest shadow hover:bg-green-400 transition-all">
                          Release Results 📢
                        </button>
                      </div>
                    </div>
                    <div className="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-6 gap-4 max-h-[500px] overflow-y-auto pr-2">
                      {Array.from({length: 60}).map((_, i) => (
                        <div key={i} className="p-3 bg-gray-50 border border-gray-100 rounded-2xl flex flex-col items-center">
                          <div className="w-8 h-8 rounded-full bg-white border-2 border-[#98FB98] flex items-center justify-center font-black text-xs text-gray-700 mb-2">{i+1}</div>
                          <p className="text-[9px] font-black text-gray-400 mb-3 text-center uppercase">Stu {i+1}</p>
                          <div className="flex gap-1 w-full">
                            <button className="flex-1 py-1.5 bg-[#98FB98]/50 text-green-900 rounded-lg text-[10px] font-black hover:bg-[#98FB98] transition-colors">P</button>
                            <button onClick={() => {
                              const msg = `🚨 ALERT: Your ward (Student ${i+1}) is ABSENT today at Pratap Vidhya Mandir. Please contact the class teacher.`;
                              window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
                            }} className="flex-1 py-1.5 bg-red-100 text-red-800 rounded-lg text-[10px] font-black hover:bg-red-500 hover:text-white transition-all">A 🚨</button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* REGISTER STUDENT */}
                {view === 'register' && (
                  <div className="animate-fade-in-scale max-w-2xl mx-auto bg-white p-10 rounded-[30px] shadow border border-gray-100">
                    <h3 className="text-2xl font-black text-gray-900 mb-8 border-l-8 border-gray-900 pl-4 tracking-tighter">👤 New Student Enrollment</h3>
                    <form onSubmit={handleRegister} className="space-y-5">
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                          <label className="text-[10px] font-black text-gray-400 uppercase tracking-widest block mb-1">Full Name</label>
                          <input name="name" type="text" placeholder="Student Full Name" className="w-full p-4 bg-gray-50 rounded-2xl font-bold focus:outline-none focus:ring-2 focus:ring-[#98FB98]" required />
                        </div>
                        <div>
                          <label className="text-[10px] font-black text-gray-400 uppercase tracking-widest block mb-1">Portal ID</label>
                          <input name="studentId" type="text" placeholder="e.g. STU02" className="w-full p-4 bg-gray-50 rounded-2xl font-bold focus:outline-none focus:ring-2 focus:ring-[#98FB98]" required />
                        </div>
                        <div>
                          <label className="text-[10px] font-black text-gray-400 uppercase tracking-widest block mb-1">Standard</label>
                          <input name="standard" type="number" min="7" max="12" placeholder="7 to 12" className="w-full p-4 bg-gray-50 rounded-2xl font-bold focus:outline-none focus:ring-2 focus:ring-[#98FB98]" required />
                        </div>
                        <div>
                          <label className="text-[10px] font-black text-gray-400 uppercase tracking-widest block mb-1">Division</label>
                          <input name="div" type="text" placeholder="e.g. A" className="w-full p-4 bg-gray-50 rounded-2xl font-bold focus:outline-none focus:ring-2 focus:ring-[#98FB98]" required />
                        </div>
                        <div>
                          <label className="text-[10px] font-black text-gray-400 uppercase tracking-widest block mb-1">Parent WhatsApp No</label>
                          <input name="parentPhone" type="tel" placeholder="+91 XXXXXXXXXX" className="w-full p-4 bg-gray-50 rounded-2xl font-bold focus:outline-none focus:ring-2 focus:ring-[#98FB98]" required />
                        </div>
                        <div>
                          <label className="text-[10px] font-black text-gray-400 uppercase tracking-widest block mb-1">Password</label>
                          <input name="password" type="password" placeholder="Set Login Passcode" className="w-full p-4 bg-gray-50 rounded-2xl font-bold focus:outline-none focus:ring-2 focus:ring-[#98FB98]" required />
                        </div>
                      </div>
                      <div>
                        <label className="text-[10px] font-black text-gray-400 uppercase tracking-widest block mb-1">Student Photo URL (optional)</label>
                        <input name="photo" type="text" placeholder="Paste image URL or leave blank for auto-avatar" className="w-full p-4 bg-gray-50 rounded-2xl font-bold focus:outline-none focus:ring-2 focus:ring-[#98FB98]" />
                      </div>
                      <button className="w-full bg-gray-900 text-white py-5 rounded-3xl font-black tracking-widest uppercase hover:bg-black transition-all shadow-xl mt-4">Add to Master Database →</button>
                    </form>
                  </div>
                )}

                {/* UPLOAD DOCS */}

    const App = () => {
      const [showSplash, setShowSplash] = useState(true);
      const [currentUser, setCurrentUser] = useState(null);

      useEffect(() => {
        // UNCONDITIONAL MASTER RESET
        const bulk = [
          { id: 'ADMIN01', password: 'admin123', name: 'Tech Potdar', role: 'admin', image: 'https://api.dicebear.com/7.x/avataaars/svg?seed=Admin', blocked: false },
          { id: 'FAC01', password: '123', name: 'Prof. Patil', role: 'faculty', image: 'https://api.dicebear.com/7.x/avataaars/svg?seed=Teacher1', class: '10-A', blocked: false },
          { id: 'STU01', password: '123', name: 'Rahul Shinde', role: 'student', image: 'https://api.dicebear.com/7.x/avataaars/svg?seed=Student1', class: '10th Standard', blocked: false }
        ];
        localStorage.setItem('pvm_users', JSON.stringify(bulk));
      }, []);

      const handleAdd = (nu) => {
        const users = JSON.parse(localStorage.getItem('pvm_users') || '[]');
        users.push({...nu, blocked: false});
        localStorage.setItem('pvm_users', JSON.stringify(users));
      };

      const handleToggle = (id) => {
        const users = JSON.parse(localStorage.getItem('pvm_users') || '[]');
        const updated = users.map(u => u.id === id ? {...u, blocked: !u.blocked} : u);
        localStorage.setItem('pvm_users', JSON.stringify(updated));
      };

      if (showSplash) return <SplashScreen onComplete={() => setShowSplash(false)} />;
      if (!currentUser) return <Login onLoginSuccess={setCurrentUser} />;
      
      if (currentUser.role === 'admin') return <AdminDashboard user={currentUser} onLogout={()=>setCurrentUser(null)} onAddUser={handleAdd} onToggleBlock={handleToggle} onLoginAs={setCurrentUser} />;
      if (currentUser.role === 'faculty') return <TeacherDashboard user={currentUser} onLogout={()=>setCurrentUser(null)} onAddStudent={handleAdd} />;
      if (currentUser.role === 'student') return <StudentDashboard user={currentUser} onLogout={()=>setCurrentUser(null)} />;

      return <div className="text-center p-20 font-black">UNAUTHORIZED ACCESS</div>;
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
